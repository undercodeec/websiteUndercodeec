<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando Pago - Undercodeec</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        #status-icon { font-size: 48px; margin-bottom: 20px; display: none; }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
        
        #debug-log {
            margin-top: 30px;
            padding: 10px;
            background: #1e1e1e;
            color: #00ff00;
            font-family: monospace;
            font-size: 11px;
            text-align: left;
            height: 150px;
            overflow-y: auto;
            border-radius: 5px;
            display: none; /* Hidden by default */
        }
        .log-time { color: #888; margin-right: 5px; }
        .btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="spinner" class="spinner"></div>
        <div id="status-icon"></div>
        <h2 id="title">Verificando pago...</h2>
        <p id="message">Por favor espera mientras confirmamos tu transacción.</p>
        <button id="close-btn" class="btn" onclick="window.close()">Cerrar Ventana</button>
        
        <div style="margin-top: 20px;">
            <small><a href="#" onclick="document.getElementById('debug-log').style.display='block'; return false;" style="color: #999; text-decoration: none;">Ver detalles técnicos</a></small>
        </div>
        <div id="debug-log"></div>
    </div>

    <script>
        // Configuration
        const IS_PROD = window.location.hostname !== 'localhost';
        const BACKEND_URL = IS_PROD ? 'https://api.undercodeec.com' : 'http://localhost:3001';
        
        // Logging function
        function log(msg) {
            const el = document.getElementById('debug-log');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
            el.appendChild(div);
            el.scrollTop = el.scrollHeight;
            console.log(`[Payment] ${msg}`);
        }

        // UI Updates
        function setStatus(type, titleText, messageText) {
            const spinner = document.getElementById('spinner');
            const icon = document.getElementById('status-icon');
            const title = document.getElementById('title');
            const msg = document.getElementById('message');
            const closeBtn = document.getElementById('close-btn');

            spinner.style.display = 'none';
            icon.style.display = 'block';
            
            title.textContent = titleText;
            msg.textContent = messageText;

            if (type === 'success') {
                icon.innerHTML = '✓';
                icon.className = 'success';
                // Auto close hint
                msg.innerHTML = messageText + '<br><br>Cerrando automáticamente...';
            } else {
                icon.innerHTML = '✕';
                icon.className = 'error';
                closeBtn.style.display = 'inline-block';
            }
        }

        async function init() {
            log('Iniciando confirmación de pago (Static HTML mode)');
            log('URL: ' + window.location.href);

            const params = new URLSearchParams(window.location.search);
            const id = params.get('id') || params.get('ID');
            const clientTransactionId = params.get('clientTransactionId') || params.get('clientTransactionID');

            log(`Params - id: ${id}, clientTxId: ${clientTransactionId}`);

            if (!id || !clientTransactionId) {
                log('❌ Error: Faltan parámetros');
                setStatus('error', 'Error de Datos', 'No se recibieron los datos del pago.');
                return;
            }

            try {
                // Get order data if available
                const pendingOrderData = localStorage.getItem('pendingOrderData');
                let orderData = null;
                if (pendingOrderData) {
                    try {
                        orderData = JSON.parse(pendingOrderData);
                        log('✅ Datos de orden recuperados de localStorage');
                    } catch(e) { log('⚠️ Error parseando orderData'); }
                }

                log(`🔄 Conectando con backend: ${BACKEND_URL}/api/confirm-payment`);

                const response = await fetch(`${BACKEND_URL}/api/confirm-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, clientTransactionId, orderData })
                });

                log(`📨 Estado HTTP: ${response.status}`);

                if (!response.ok) {
                    throw new Error(`Error del servidor: ${response.status}`);
                }

                const data = await response.json();
                log(`📦 Respuesta: ${JSON.stringify(data).substring(0, 100)}...`);

                if (data.success && data.transactionStatus === 3) {
                    log('✅ PAGO APROBADO');
                    setStatus('success', '¡Pago Exitoso!', 'Tu pago ha sido procesado correctamente.');

                    // 1. Save to LocalStorage (Reliable sync)
                    const paymentData = {
                        success: true,
                        transactionId: data.details?.transactionId,
                        amount: data.details?.amount,
                        timestamp: Date.now()
                    };
                    
                    localStorage.setItem('paymentCompleted', JSON.stringify(paymentData));
                    localStorage.setItem('paymentNotification', JSON.stringify({
                        type: 'PAYMENT_COMPLETED',
                        ...paymentData
                    }));
                    
                    localStorage.removeItem('pendingOrderData');
                    log('💾 Guardado en localStorage');

                    // 2. Send postMessage (If window is available)
                    if (window.opener && !window.opener.closed) {
                        try {
                            window.opener.postMessage({
                                type: 'PAYMENT_COMPLETED',
                                ...paymentData
                            }, '*');
                            log('📤 Mensaje enviado a ventana padre');
                        } catch (e) {
                            log('⚠️ Error enviando postMessage: ' + e.message);
                        }
                    } else {
                        log('⚠️ Ventana padre no detectada');
                    }

                    // 3. Auto Close
                    log('⏳ Cerrando en 3 segundos...');
                    setTimeout(() => {
                        window.close();
                    }, 3000);

                } else {
                    log('❌ Pago rechazado/cancelado status: ' + data.transactionStatus);
                    setStatus('error', 'Pago no procesado', data.message || 'El pago fue rechazado o cancelado.');
                }

            } catch (error) {
                log('❌ Error crítico: ' + error.message);
                setStatus('error', 'Error de conexión', 'No pudimos verificar el pago. Por favor contacta a soporte.');
            }
        }

        // Run on load
        window.onload = init;
    </script>
</body>
</html>
