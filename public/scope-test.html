<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}#c{width:400px;height:400px;display:block}</style></head>
<body><canvas id="c"></canvas><div id="log" style="font:11px monospace;white-space:pre-wrap"></div>
<script type="importmap">{ "imports": { "three":"/node-three/three.module.js", "three/addons/":"/node-three/jsm/" }}</script>
<script type="module">
const log=(m)=>{document.getElementById('log').textContent+=m+"\n";};
window.onerror=(m,s,l)=>log("ERR "+m+" @"+l);
try{
const THREE=await import("three");
const {GLTFLoader}=await import("three/addons/loaders/GLTFLoader.js");
const {DRACOLoader}=await import("three/addons/loaders/DRACOLoader.js");

const BRAND_RAMP=[0x600b56,0x3a1147,0x270f31], BRAND_ACCENT=0xefa238;
const key=(a,i)=>((a.getX(i)*255|0)*65536+(a.getY(i)*255|0)*256+(a.getZ(i)*255|0));
function remap(g){
  const a=g.attributes.color, counts=new Map();
  for(let i=0;i<a.count;i++){const k=key(a,i);counts.set(k,(counts.get(k)||0)+1);}
  const ranked=[...counts.entries()].sort((x,y)=>y[1]-x[1]).map(e=>e[0]);
  const st=new Map(); ranked.slice(0,BRAND_RAMP.length).forEach((k,i)=>st.set(k,BRAND_RAMP[i]));
  const c=new THREE.Color();
  for(let i=0;i<a.count;i++){const k=key(a,i);c.set(st.has(k)?st.get(k):BRAND_ACCENT);a.setXYZ(i,c.r,c.g,c.b);}
  a.needsUpdate=true;
}
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true}); renderer.setSize(400,400,false);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,0.1,100); camera.position.set(0,0,3.8);
const key1=new THREE.DirectionalLight(0xffffff,2.4); key1.position.set(2,3,4); scene.add(key1);
const rim=new THREE.DirectionalLight(0xefa238,1.1); rim.position.set(-3,-1,2); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff,1.15));
const spin=new THREE.Group(); scene.add(spin);
const draco=new DRACOLoader(); draco.setDecoderPath("/landing-espana/stack-timeline/draco/gltf/");
const gl=new GLTFLoader(); gl.setDRACOLoader(draco);
const outlineMat=new THREE.MeshBasicMaterial({color:0x0a0a0f,side:THREE.BackSide});
gl.load("/landing-espana/stack-timeline/scope.glb",(g)=>{
  const model=g.scene, meshes=[];
  model.traverse(o=>{if(o.isMesh)meshes.push(o);});
  meshes.forEach(o=>{
    if(o.geometry.attributes.color) remap(o.geometry);
    o.material=new THREE.MeshToonMaterial({vertexColors:true,color:0xffffff});
    const ol=new THREE.Mesh(o.geometry,outlineMat); ol.scale.multiplyScalar(1.035); o.add(ol);
  });
  const box=new THREE.Box3().setFromObject(model), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  model.position.sub(center); model.scale.setScalar(1.9/(Math.max(size.x,size.y,size.z)||1)); spin.add(model);
  log("model added");
}, undefined, (e)=>log("GLB ERR "+e));
function loop(){spin.rotation.z-=0.008;renderer.render(scene,camera);requestAnimationFrame(loop);}
loop();
}catch(e){log("FATAL "+(e.stack||e));}
</script></body></html>
